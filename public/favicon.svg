<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- Full-bleed paper field (iOS masks corners) -->
  <rect width="1024" height="1024" fill="#F4F1EA"/>
  <!-- Open book — crisp geometric, high contrast ink -->
  <g fill="#2F3A48">
    <!-- left page -->
    <path d="M512 268C428 228 316 228 232 252v492c88-24 204-22 280 28V268z"/>
    <!-- right page -->
    <path d="M512 268c84-40 196-40 280-16v492c-88-24-204-22-280 28V268z"/>
  </g>
  <!-- spine highlight (clean white line) -->
  <path d="M512 292v486" stroke="#F4F1EA" stroke-width="22" stroke-linecap="round"/>
  <!-- text lines left -->
  <g stroke="#F4F1EA" stroke-width="20" stroke-linecap="round">
    <path d="M300 400h128"/>
    <path d="M300 468h108"/>
    <path d="M300 536h118"/>
  </g>
  <!-- text lines right (balance, sharper silhouette) -->
  <g stroke="#F4F1EA" stroke-width="20" stroke-linecap="round" opacity="0.85">
    <path d="M596 400h128"/>
    <path d="M596 468h108"/>
    <path d="M596 536h118"/>
  </g>
</svg>
