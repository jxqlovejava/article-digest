<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/favicon.png?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
  <title>知识复习</title>
  <style>
    :root {
      --bg: #f5f5f5; --surface: #fff; --text: #1a1a1a;
      --text-secondary: #888; --text-tertiary: #aaa;
      --accent: #5a5a5a; --accent-bg: #f0f0f0;
      --border: #eee; --shadow-sm: rgba(0,0,0,0.05); --shadow-md: rgba(0,0,0,0.1);
      --code-bg: #f2f2f2; --code-color: #d63384;
      --sidebar-w: min(260px, 82vw);
    }
    [data-theme="dark"] {
      --bg: #0f0f0f; --surface: #1a1a1a; --text: #e8e8e8;
      --text-secondary: #b0b0b0; --text-tertiary: #888;
      --accent: #b0b0b0; --accent-bg: #2a2a2a;
      --border: #3a3a3a; --shadow-sm: rgba(0,0,0,0.3); --shadow-md: rgba(0,0,0,0.4);
      --code-bg: #2d2d2d; --code-color: #ff8fab;
    }
    @keyframes skeleton-pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.7; } }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100vh; min-height: 100dvh; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased; transition: background 0.3s ease, color 0.3s ease;
      line-height: 1.7;
    }
    .page-wrapper { min-height: 100vh; min-height: 100dvh; }
    .container { max-width: 840px; margin: 0 auto; padding: 0 16px 40px; }
    .nav-bar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 8px;
      padding: max(8px, env(safe-area-inset-top)) 16px 10px;
      background: var(--bg);
    }
    .nav-bar .back-link {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: var(--surface); color: var(--text-secondary); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; box-shadow: 0 1px 4px var(--shadow-sm);
      -webkit-tap-highlight-color: transparent;
    }
    .nav-bar .back-link:hover { color: var(--text); }
    .nav-bar .back-link svg { width: 20px; height: 20px; }
    .nav-bar .nav-title { font-size: 20px; font-weight: 700; color: var(--text); flex: 1; }
    .theme-btn {
      width: 36px; height: 36px; border: none; border-radius: 50%;
      background: transparent; color: var(--text-secondary); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .theme-btn:hover { color: var(--text); }
    h2 { font-size: 18px; font-weight: 700; margin: 24px 0 12px; color: var(--text); }
    .card {
      background: var(--surface); border-radius: 12px; padding: 16px;
      margin-bottom: 16px; box-shadow: 0 1px 3px var(--shadow-sm);
      transition: background 0.3s ease;
    }
    .stat-row { display: flex; gap: 16px; flex-wrap: wrap; }
    .stat-box {
      flex: 1; min-width: 100px; padding: 16px; border-radius: 10px;
      background: var(--accent-bg); text-align: center;
    }
    .stat-box .value { font-size: 28px; font-weight: 700; color: var(--text); }
    .stat-box .label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    .review-item {
      padding: 12px 0; border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .review-item:last-child { border-bottom: none; }
    .review-question { color: var(--text); font-weight: 500; margin-bottom: 4px; }
    .review-meta { font-size: 12px; color: var(--text-secondary); }
    .review-meta .tag {
      display: inline-block; padding: 1px 8px; border-radius: 4px;
      background: var(--accent-bg); color: var(--accent); font-size: 11px;
      margin-right: 6px;
    }
    .cluster-item {
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .cluster-item:last-child { border-bottom: none; }
    .cluster-topic {
      font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px;
    }
    .cluster-summary { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .cluster-count { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }
    .synthesis-item {
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .synthesis-item:last-child { border-bottom: none; }
    .synthesis-period {
      font-size: 13px; color: var(--text-tertiary); margin-bottom: 4px;
    }
    .synthesis-summary { font-size: 14px; color: var(--text); line-height: 1.6; }
    .synthesis-highlights { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .synthesis-highlight {
      display: inline-block; padding: 2px 10px; border-radius: 12px;
      background: var(--accent-bg); color: var(--accent); font-size: 12px;
    }
    /* Review interaction */
    .review-item { cursor: pointer; transition: background 0.15s; padding: 14px 12px; margin: 0 -12px; border-radius: 8px; }
    .review-item + .review-item { margin-top: 4px; }
    .review-item:hover { background: var(--accent-bg); }
    .review-item.expanded { background: var(--accent-bg); }
    .review-answer-row { display: none; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
    .review-item.expanded .review-answer-row { display: block; }
    .review-input {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--bg); color: var(--text);
      font-size: 14px; font-family: inherit; resize: vertical;
    }
    .review-input:focus { border-color: var(--accent); outline: none; }
    .review-actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .review-submit {
      padding: 6px 16px; border: none; border-radius: 6px;
      background: var(--accent); color: #fff; font-size: 13px; cursor: pointer;
    }
    .review-submit:disabled { opacity: 0.4; }
    .review-feedback { font-size: 13px; padding: 4px 0; }
    .review-feedback.correct { color: #2e7d32; }
    .review-feedback.wrong { color: var(--danger); }
    /* Action buttons */
    .action-btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .action-btn {
      padding: 5px 14px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface); color: var(--accent); font-size: 13px; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .action-btn:hover { border-color: var(--accent); background: var(--accent-bg); }
    .action-btn:disabled { opacity: 0.4; cursor: default; }
    .action-msg { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    /* Tabs */
    .tab-bar { display: flex; position: sticky; top: 44px; z-index: 40; background: var(--bg); padding: 8px 0 0; }
    .tab-btn { flex: 1; padding: 10px 0; border: none; background: none; color: var(--text-secondary); font-size: 15px; font-weight: 500; cursor: pointer; text-align: center; position: relative; transition: color 0.2s; }
    .tab-btn.active { color: var(--text); font-weight: 600; }
    .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 20px; height: 3px; border-radius: 2px; background: var(--accent); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .skeleton { animation: skeleton-pulse 1.5s ease-in-out infinite; border-radius: 6px; background: var(--border); }
    .skeleton-h { height: 18px; margin-bottom: 8px; }
    .skeleton-w60 { width: 60%; }
    .skeleton-w40 { width: 40%; }
    .error-state {
      padding: 24px; text-align: center; color: var(--text-tertiary); font-size: 14px;
    }
    .empty-state {
      padding: 24px; text-align: center; color: var(--text-tertiary); font-size: 14px;
    }
    @media (max-width: 480px) {
      .stat-box { min-width: 80px; padding: 12px; }
      .stat-box .value { font-size: 22px; }
    }
  </style>
</head>
<body>
<div class="page-wrapper">
<div class="nav-bar">
  <a href="/" class="back-link" title="返回列表">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12H6"/><path d="M12 5l-7 7 7 7"/></svg>
  </a>
  <span class="nav-title">知识复习</span>
  <button class="theme-btn" onclick="toggleTheme()" title="切换主题">
    <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  </button>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('review')">复习</button>
  <button class="tab-btn" onclick="switchTab('insight')">AI 洞察</button>
</div>

<div class="container">

  <div class="tab-panel active" id="tab-review">
  <!-- Review Stats -->
  <h2>复习统计</h2>
  <div class="card"><div class="stat-row" id="reviewStats"><div class="skeleton skeleton-h" style="width:100%;height:60px"></div></div></div>

  <!-- Due Reviews -->
  <h2>待复习</h2>
  <div class="card" id="dueReviews"><div class="skeleton skeleton-h skeleton-w60"></div><div class="skeleton skeleton-h skeleton-w40"></div></div>
  </div>

  <div class="tab-panel" id="tab-insight">
  <!-- Topic Clusters -->
  <h2>知识聚类</h2>
  <div class="card" id="clusters"><div class="skeleton skeleton-h skeleton-w60"></div><div class="skeleton skeleton-h skeleton-w40"></div></div>

  <!-- Synthesis -->
  <h2>周期性总结</h2>
  <div class="card" id="syntheses"><div class="skeleton skeleton-h skeleton-w60"></div><div class="skeleton skeleton-h skeleton-w40"></div></div>

  </div>

</div>
</div>

<script>
(function() {
  var t = localStorage.getItem('theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
  else if (window.matchMedia('(prefers-color-scheme:dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
  updateThemeIcon();
})();

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.toggle('active', b.textContent.trim() === (name==='review'?'复习':'AI 洞察')); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.toggle('active', p.id === 'tab-' + name); });
  localStorage.setItem('knowledgeTab', name);
}

(function() {
  var tab = localStorage.getItem('knowledgeTab') || 'review';
  switchTab(tab);
})();

function toggleTheme() {
  var c = document.documentElement.getAttribute('data-theme');
  var n = c === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  localStorage.setItem('theme', n);
  updateThemeIcon();
}

function updateThemeIcon() {
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  var s = document.getElementById('theme-icon-sun');
  var m = document.getElementById('theme-icon-moon');
  if (s) s.style.display = isDark ? 'none' : '';
  if (m) m.style.display = isDark ? '' : 'none';
}

async function apiGet(path) {
  try {
    var res = await fetch(path);
    return await res.json();
  } catch (err) {
    return { error: err.message || 'Network error' };
  }
}

async function apiPost(path, body) {
  try {
    var res = await fetch(path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    return await res.json();
  } catch (err) {
    return { error: err.message || 'Network error' };
  }
}

function renderStats(data) {
  var el = document.getElementById('reviewStats');
  if (!data || data.error) {
    el.innerHTML = '<div class="error-state">加载失败: ' + (data ? data.error : '未知错误') + '</div>';
    return;
  }
  var stats = data.data || {};
  el.innerHTML =
    '<div class="stat-box"><div class="value">' + (stats.total || 0) + '</div><div class="label">总计</div></div>' +
    '<div class="stat-box"><div class="value">' + (stats.due || 0) + '</div><div class="label">待复习</div></div>' +
    '<div class="stat-box"><div class="value">' + (stats.mastered || 0) + '</div><div class="label">已掌握</div></div>';
}

var __reviewCache = [];

function renderDueReviews(data) {
  var el = document.getElementById('dueReviews');
  if (!data || data.error) {
    el.innerHTML = '<div class="error-state">加载失败: ' + (data ? data.error : '未知错误') + '</div>';
    return;
  }
  var reviews = data.data;
  if (!reviews || reviews.length === 0) {
    el.innerHTML = '<div class="empty-state">暂无待复习内容</div>';
    return;
  }
  __reviewCache = reviews;
  el.innerHTML = reviews.map(function(r, i) {
    return '<div class="review-item" data-ri="'+i+'" onclick="toggleReview(event,'+i+')">' +
      '<div class="review-question">' + escapeHtml(r.question || '') + '</div>' +
      '<div class="review-meta">' +
        (r.knowledgeType ? '<span class="tag">' + escapeHtml(r.knowledgeType) + '</span>' : '') +
        reviewLevelLabel(r) +
      '</div>' +
      '<div class="review-answer-row">' +
        '<textarea class="review-input" id="reviewInput'+i+'" rows="2" placeholder="输入你的回答..."></textarea>' +
        '<div class="review-actions">' +
          '<button class="review-submit" onclick="event.stopPropagation();submitAnswer('+i+')">提交</button>' +
        '</div>' +
        '<div class="review-feedback" id="feedback'+i+'"></div>' +
      '</div></div>';
  }).join('');
}

function toggleReview(ev, i) {
  var item = ev.currentTarget;
  item.classList.toggle('expanded');
  if (item.classList.contains('expanded')) {
    document.getElementById('reviewInput'+i).focus();
  }
}

async function submitAnswer(i) {
  var r = __reviewCache[i]; if (!r) return;
  var input = document.getElementById('reviewInput'+i);
  var btn = input && input.closest('.review-answer-row').querySelector('.review-submit');
  var fb = document.getElementById('feedback'+i);
  var answer = input ? input.value.trim() : '';
  if (!answer) return;
  if (btn) { btn.disabled = true; btn.textContent = '评分中...'; }
  try {
    var result = await apiPost('/api/knowledge/reviews/grade', {
      questionId: r.questionId || r.id,
      answer: answer
    });
    if (result.success && result.data) {
      var correct = result.data.isCorrect !== undefined ? result.data.isCorrect : result.data.correct;
      if (correct) {
        if (fb) fb.className = 'review-feedback correct';
        if (fb) fb.innerHTML = '✓ 正确！';
      } else {
        if (fb) fb.className = 'review-feedback wrong';
        if (fb) fb.innerHTML = '✗ 不正确。参考答案：' + escapeHtml(r.expectedAnswer || '(无)');
      }
      // Refresh stats
      setTimeout(function() {
        apiGet('/api/knowledge/reviews/stats').then(renderStats);
        apiGet('/api/knowledge/reviews/due').then(renderDueReviews);
      }, 800);
    } else {
      if (fb) fb.className = 'review-feedback wrong';
      if (fb) fb.innerHTML = '评分失败: ' + escapeHtml(result.error || '未知错误');
    }
  } catch (err) {
    if (fb) fb.className = 'review-feedback wrong';
    if (fb) fb.innerHTML = '网络错误';
  }
  if (btn) { btn.disabled = false; btn.textContent = '提交'; }
}

function renderClusters(data) {
  var el = document.getElementById('clusters');
  if (!data || data.error) {
    el.innerHTML = '<div class="error-state">加载失败: ' + (data ? data.error : '未知错误') + '</div>';
    return;
  }
  var clusters = data.data;
  if (!clusters || clusters.length === 0) {
    el.innerHTML = '<div class="empty-state">暂无知识聚类</div>' +
      '<div class="action-btn-row" style="justify-content:center"><button class="action-btn" onclick="generateClusters(this)">生成聚类</button></div>' +
      '<div class="action-msg" style="text-align:center" id="clusterMsg"></div>';
    return;
  }
  el.innerHTML = clusters.map(function(c) {
    var topic = c.topic || '未分类';
    // Make bare-keyword topics (from fallback) look better
    if (/^[a-zA-Z]+$/.test(topic)) topic = '#' + topic;
    if (/^[一-鿿]{1,2}$/.test(topic)) topic = topic + ' 相关';

    var html = '<div class="cluster-item">' +
      '<div class="cluster-topic">' + escapeHtml(topic) + '</div>';

    // Summary: split by newlines into separate points
    if (c.summary) {
      var lines = c.summary.split('\n').filter(function(l) { return l.trim(); });
      if (lines.length > 1) {
        html += '<div class="cluster-summary">' + lines.map(function(l) {
          return '<div style="margin-bottom:6px">' + escapeHtml(l.trim()) + '</div>';
        }).join('') + '</div>';
      } else {
        html += '<div class="cluster-summary">' + escapeHtml(c.summary) + '</div>';
      }
    }

    // Agreements / disagreements
    var agreements = c.agreements || [];
    var disagreements = c.disagreements || [];
    if (agreements.length > 0) {
      html += '<div style="color:#2e7d32;font-size:13px;margin-top:8px;line-height:1.6">' +
        agreements.map(function(a) { return '✓ ' + escapeHtml(a); }).join('<br>') + '</div>';
    }
    if (disagreements.length > 0) {
      html += '<div style="color:#c0392b;font-size:13px;margin-top:4px;line-height:1.6">' +
        disagreements.map(function(d) { return '⚠ ' + escapeHtml(d); }).join('<br>') + '</div>';
    }

    // Article links with titles
    var articleFileNames = c.articleFileNames || [];
    var articleTitles = c.articleTitles || [];
    if (articleFileNames.length > 0) {
      html += '<div class="cluster-count">' + articleFileNames.length + ' 篇文章</div>';
      html += '<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">';
      for (var ai = 0; ai < articleFileNames.length; ai++) {
        var title = articleTitles[ai] || articleFileNames[ai];
        html += '<a href="/articles/'+articleFileNames[ai]+'" style="font-size:12px;color:var(--accent);text-decoration:none;padding:2px 8px;background:var(--accent-bg);border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px">' + escapeHtml(title.length > 30 ? title.substring(0,28)+'…' : title) + '</a>';
      }
      html += '</div>';
    }

    html += '</div>';
    return html;
  }).join('');
}

function renderSyntheses(data) {
  var el = document.getElementById('syntheses');
  if (!data || data.error) {
    el.innerHTML = '<div class="error-state">加载失败: ' + (data ? data.error : '未知错误') + '</div>';
    return;
  }
  var syntheses = data.data;
  if (!syntheses || syntheses.length === 0) {
    el.innerHTML = '<div class="empty-state">暂无周期性总结</div>' +
      '<div class="action-btn-row" style="justify-content:center">' +
        '<button class="action-btn" onclick="generateSynthesis(\'daily\',this)">生成日报</button>' +
        '<button class="action-btn" onclick="generateSynthesis(\'weekly\',this)">生成周报</button>' +
        '<button class="action-btn" onclick="generateSynthesis(\'monthly\',this)">生成月报</button>' +
      '</div>' +
      '<div class="action-msg" style="text-align:center" id="synthesisMsg"></div>';
    return;
  }
  el.innerHTML = syntheses.map(function(s) {
    var periodLabel = s.period === 'daily' ? '日' : s.period === 'weekly' ? '周' : '月';
    var timeRange = formatSynthesisTime(s);
    var highlights = (s.highlights || []).map(function(h) {
      return '<span class="synthesis-highlight">' + escapeHtml(h) + '</span>';
    }).join('');
    return '<div class="synthesis-item">' +
      '<div class="synthesis-period">' + periodLabel + '报总结 <span style="color:var(--text-tertiary);font-size:11px">' + timeRange + '</span></div>' +
      (s.summary ? '<div class="synthesis-summary">' + escapeHtml(s.summary) + '</div>' : '') +
      (highlights ? '<div class="synthesis-highlights">' + highlights + '</div>' : '') +
      '</div>';
  }).join('');
}

function reviewLevelLabel(r) {
  var state = r.state || {};
  var idx = state.intervalIndex || 0;
  var correct = state.consecutiveCorrect || 0;
  if (idx === 0 && correct === 0) return '<span style="color:var(--accent);font-size:12px">🆕 新学</span>';
  if (idx <= 1) return '<span style="color:#e67e22;font-size:12px">📖 学习 (×'+correct+')</span>';
  if (idx <= 2) return '<span style="color:#f1c40f;font-size:12px">🔄 巩固 (×'+correct+')</span>';
  if (idx <= 3) return '<span style="color:#3498db;font-size:12px">✅ 复习 (×'+correct+')</span>';
  return '<span style="color:#2ecc71;font-size:12px">⭐ 掌握 (×'+correct+')</span>';
}

function formatSynthesisTime(s) {
  function fmt(ts) {
    var d = new Date(ts);
    return (d.getMonth()+1) + '/' + d.getDate();
  }
  if (s.period === 'daily' && s.periodStart) {
    return fmt(s.periodStart);
  } else if (s.period === 'weekly' && s.periodStart) {
    var d = new Date(s.periodStart);
    var end = new Date(d.getTime() + 6 * 86400000);
    return fmt(s.periodStart) + ' - ' + fmt(end.getTime());
  } else if (s.period === 'monthly' && s.periodStart) {
    var dm = new Date(s.periodStart);
    return (dm.getFullYear()) + '/' + (dm.getMonth()+1);
  }
  return '';
}

function escapeHtml(text) {
  return (text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Generation helpers ──

async function generateClusters(btn) {
  if (btn) { btn.disabled = true; btn.textContent = '生成中...'; }
  var msg = document.getElementById('clusterMsg');
  if (msg) msg.textContent = '正在生成知识聚类（可能需要几十秒）...';
  try {
    var res = await apiPost('/api/knowledge/clusters/rebuild');
    if (msg) msg.textContent = res.success
      ? '生成成功！刷新中...'
      : '生成失败: ' + (res.error || '未知错误');
    setTimeout(function() { apiGet('/api/knowledge/clusters').then(renderClusters); }, 500);
  } catch (err) {
    if (msg) msg.textContent = '网络错误';
  }
  if (btn) { btn.disabled = false; btn.textContent = '生成聚类'; }
}

async function generateSynthesis(period, btn) {
  if (btn) { btn.disabled = true; btn.textContent = '生成中...'; }
  var msg = document.getElementById('synthesisMsg');
  if (msg) msg.textContent = '正在生成' + (period === 'daily' ? '日' : period === 'weekly' ? '周' : '月') + '报（可能需要几十秒）...';
  try {
    var res = await apiPost('/api/knowledge/synthesis/generate', { period: period });
    if (msg) msg.textContent = res.success
      ? '生成成功！刷新中...'
      : '生成失败: ' + (res.error || '未知错误');
    setTimeout(function() { apiGet('/api/knowledge/synthesis/latest').then(renderSyntheses); }, 500);
  } catch (err) {
    if (msg) msg.textContent = '网络错误';
  }
  if (btn) { btn.disabled = false; btn.textContent = period === 'daily' ? '生成日报' : period === 'weekly' ? '生成周报' : '生成月报'; }
}

// Load all sections in parallel
Promise.all([
  apiGet('/api/knowledge/reviews/stats').then(renderStats),
  apiGet('/api/knowledge/reviews/due').then(renderDueReviews),
  apiGet('/api/knowledge/clusters').then(renderClusters),
  apiGet('/api/knowledge/synthesis/latest').then(renderSyntheses),
]);
</script>
